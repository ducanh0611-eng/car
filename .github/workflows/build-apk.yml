name: Build CarNaviLauncher APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'
        cache-disabled: true

    - name: Grant Execute Permission and Fix Wrapper
      run: |
        find . -name "gradlew" -exec chmod +x {} +
        TARGET_DIR="."
        if [ ! -f "build.gradle.kts" ] && [ -d "CarNaviLauncher" ]; then
          TARGET_DIR="CarNaviLauncher"
        fi
        
        cd "$TARGET_DIR"
        if [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
          echo "gradle-wrapper.jar is missing. Regenerating wrapper..."
          gradle wrapper --gradle-version 8.7
        fi

    - name: Build Debug APK
      run: |
        TARGET_DIR="."
        if [ ! -f "build.gradle.kts" ] && [ -d "CarNaviLauncher" ]; then
          TARGET_DIR="CarNaviLauncher"
        fi
        
        cd "$TARGET_DIR"
        if [ -s "gradle/wrapper/gradle-wrapper.jar" ]; then
          ./gradlew assembleDebug --no-daemon --stacktrace
        else
          gradle assembleDebug --no-daemon --stacktrace
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: CarNaviLauncher-Debug-APK
        path: "**/app/build/outputs/apk/debug/*.apk"
