name: Build CarNaviLauncher APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'
        cache-disabled: true

    - name: Locate Android Project and Prepare Build
      id: locate
      run: |
        find . -name "gradlew" -exec chmod +x {} +
        
        echo "=== Locating Android Project Root ==="
        MANIFEST=$(find . -name "AndroidManifest.xml" | head -n 1)
        if [ -z "$MANIFEST" ]; then
          echo "ERROR: Could not find AndroidManifest.xml in the repository!"
          find . -maxdepth 4 -not -path '*/.*'
          exit 1
        fi
        
        APP_DIR=$(dirname $(dirname $(dirname "$MANIFEST")))
        PROJECT_ROOT=$(dirname "$APP_DIR")
        if [ -z "$PROJECT_ROOT" ] || [ "$PROJECT_ROOT" = "." ]; then
          PROJECT_ROOT="."
        fi
        
        echo "Project root detected at: $PROJECT_ROOT"
        echo "project_root=$PROJECT_ROOT" >> $GITHUB_OUTPUT
        
        cd "$PROJECT_ROOT"
        mkdir -p gradle
        echo "" | base64 -d > gradle/libs.versions.toml

        if [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
          echo "Regenerating gradle-wrapper..."
          gradle wrapper --gradle-version 8.7
        fi

    - name: Build Debug APK
      run: |
        PROJECT_ROOT="${{ steps.locate.outputs.project_root }}"
        cd "$PROJECT_ROOT"
        
        echo "Building Android APK in: $PWD"
        if [ -s "gradle/wrapper/gradle-wrapper.jar" ]; then
          ./gradlew :app:assembleDebug --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon --stacktrace
        else
          gradle :app:assembleDebug --no-daemon --stacktrace || gradle assembleDebug --no-daemon --stacktrace
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: CarNaviLauncher-Debug-APK
        path: "**/app/build/outputs/apk/debug/*.apk"
